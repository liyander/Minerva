              'on-tertiary-fixed': 'var(--color-on-tertiary-container)',
              secondary: 'var(--color-secondary)',
              'error-container': 'var(--color-error-container)',
              primary: 'var(--color-primary)',
              'surface-container-high': 'var(--color-surface-container-high)',

  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="position: absolute; left: -9999px; z-index: -9999;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
      
      // Protect Material Symbols from being translated into text
      const iconObserver = new MutationObserver(() => {
        document.querySelectorAll('.material-symbols-outlined:not(.notranslate)').forEach(el => {
          el.classList.add('notranslate');
          el.setAttribute('translate', 'no');
        });
      });
      iconObserver.observe(document.documentElement, { childList: true, subtree: true });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
